<div class="card h-100 shadow-sm border-0 trip-card">

  <div class="position-relative">
    <img [src]="getImageUrl()" class="card-img-top" [alt]="trip().title">
    <span class="position-absolute top-0 end-0 m-3 badge bg-white text-dark shadow-sm">
      <i class="bi bi-geo-alt-fill text-danger"></i> {{ trip().destination }}
    </span>
  </div>

  <div class="card-body d-flex flex-column">

    <div class="d-flex justify-content-between text-muted small mb-2">
      <span><i class="bi bi-calendar3"></i> {{ trip().start_date | date:'dd MMM' }}</span>
      <span class="fw-bold text-primary">{{ trip().estimated_cost | currency:'EUR':'symbol':'1.0-0' }}</span>
    </div>

    <h5 class="card-title fw-bold mb-2">{{ trip().title }}</h5>
    <p class="card-text text-muted small flex-grow-1 text-truncate">
      {{ trip().description }}
    </p>

    <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
      <small class="text-muted">
        <i class="bi bi-people-fill"></i> Mín. {{ trip().min_participants }}
      </small>

      <a [routerLink]="['/viaje', trip().trip_id]" class="btn btn-outline-primary btn-sm rounded-pill px-3">
        Ver Detalle
      </a>
    </div>

  </div>
</div>
