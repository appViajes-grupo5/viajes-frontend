<div class="trip-filters-container mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button 
      class="btn btn-outline-primary"
      (click)="toggleFilters()"
      type="button"
    >
      <i class="bi bi-funnel me-2"></i>
      {{ showFilters() ? 'Ocultar' : 'Mostrar' }} Filtros
      @if (hasActiveFilters()) {
        <span class="badge bg-primary ms-2">Activos</span>
      }
    </button>
    @if (hasActiveFilters()) {
      <button 
        class="btn btn-outline-secondary btn-sm"
        (click)="clear()"
        type="button"
      >
        <i class="bi bi-x-circle me-1"></i>Limpiar
      </button>
    }
  </div>

  @if (showFilters()) {
    <div class="filters-panel card shadow-sm">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">
              <i class="bi bi-geo-alt me-1"></i>Destino
            </label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="Ej: París, Tokio..."
              [(ngModel)]="filters.destination"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-calendar-event me-1"></i>Fecha Inicio Desde
            </label>
            <input 
              type="date" 
              class="form-control" 
              [(ngModel)]="filters.startDateFrom"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-calendar-event me-1"></i>Fecha Inicio Hasta
            </label>
            <input 
              type="date" 
              class="form-control" 
              [(ngModel)]="filters.startDateTo"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-calendar-check me-1"></i>Fecha Fin Desde
            </label>
            <input 
              type="date" 
              class="form-control" 
              [(ngModel)]="filters.endDateFrom"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-calendar-check me-1"></i>Fecha Fin Hasta
            </label>
            <input 
              type="date" 
              class="form-control" 
              [(ngModel)]="filters.endDateTo"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-currency-euro me-1"></i>Precio Mínimo
            </label>
            <input 
              type="number" 
              class="form-control" 
              placeholder="0"
              min="0"
              step="0.01"
              [(ngModel)]="filters.minCost"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="bi bi-currency-euro me-1"></i>Precio Máximo
            </label>
            <input 
              type="number" 
              class="form-control" 
              placeholder="Sin límite"
              min="0"
              step="0.01"
              [(ngModel)]="filters.maxCost"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">
              <i class="bi bi-sort-alpha-down me-1"></i>Ordenar por
            </label>
            <div class="d-flex gap-2">
              <select class="form-select" [(ngModel)]="filters.sortBy">
                <option value="created">Fecha de creación</option>
                <option value="date">Fecha de inicio</option>
                <option value="price">Precio</option>
                <option value="destination">Destino</option>
              </select>
              <select class="form-select" style="width: auto;" [(ngModel)]="filters.sortOrder">
                <option value="desc">Descendente</option>
                <option value="asc">Ascendente</option>
              </select>
            </div>
          </div>

          <div class="col-12">
            <div class="d-flex gap-2 justify-content-end">
              <button 
                class="btn btn-secondary"
                (click)="clear()"
                type="button"
              >
                <i class="bi bi-x-circle me-1"></i>Limpiar
              </button>
              <button 
                class="btn btn-primary"
                (click)="applyFilters()"
                type="button"
              >
                <i class="bi bi-search me-1"></i>Aplicar Filtros
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
